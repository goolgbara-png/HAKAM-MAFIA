<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HAKAM MAFIA — مافيا الشارع</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--sf:#222224;--sf2:#323235;--tx:#f5f3ee;--mu:#9d9a92;--ac:#9c1c28;--gd:#d4af37;--gr:#2a8f5c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(ellipse at 50% -8%,#2b2024,transparent 62%) no-repeat fixed;color:var(--tx);font-family:Almarai,Tahoma,sans-serif;line-height:1.7;min-height:100vh;transition:background .4s ease}
body.mood-night{background:#0b0c12 radial-gradient(ellipse at 50% -10%,#1d172e,transparent 65%) no-repeat fixed}
body.mood-day{background:#141310 radial-gradient(ellipse at 50% -10%,#332814,transparent 62%) no-repeat fixed}
.w{max-width:560px;margin:auto;padding:14px 16px 44px}
.fl{height:12px;background:linear-gradient(#c4283a 0 25%,#0d0d0d 25% 75%,#2a8f5c 75%);border-radius:2px;outline:1px solid #8886;margin-bottom:16px}
h1,h2,h3,.tag,.tm,.big{font-family:Lalezar,Almarai,sans-serif;font-weight:400}
h1{font-size:3.4rem;line-height:1.05;margin:0}
h1 small{display:block;font:400 1rem Almarai,sans-serif;color:var(--mu);margin-top:6px}
h2{font-size:1.9rem;margin:6px 0}
h3{font-size:1.3rem;margin:0 0 6px;color:var(--gd)}
.stp0{display:inline-block;transform:rotate(-2.5deg);border:2px dashed #e0525e;color:#e0525e;padding:2px 12px;margin:10px 0;font-family:Lalezar,sans-serif;font-size:1.15rem}
.mu{color:var(--mu);font-size:.9rem;margin:6px 0}
.card{background:var(--sf);border:1px solid var(--sf2);border-radius:6px;padding:14px;margin:14px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.btn{display:block;width:100%;padding:13px;margin:10px 0;border-radius:6px;border:2px solid var(--sf2);background:var(--sf2);font:400 1.25rem Lalezar,sans-serif;transition:transform .12s ease,opacity .15s ease}
.btn:active:not(:disabled){transform:scale(.99)}
.btn.red{background:var(--gd);border-color:var(--gd);color:#17130a}
.btn.gold{background:none;border-color:var(--gd);color:var(--gd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--sf2)}
.rl b{display:block}.rl span{font-size:.78rem;color:var(--mu);line-height:1.4;display:block}
.stp{display:flex;align-items:center;gap:8px;flex:none}
.stp button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gd);background:none;font-size:1.3rem;color:var(--gd);line-height:1}
.stp i{font:400 1.5rem Lalezar,sans-serif;min-width:26px;text-align:center;font-style:normal}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:2.6rem;color:var(--gd)}
.pre{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pre button{padding:6px 12px;border-radius:20px;border:1px solid var(--gd);background:none;color:var(--gd);font-size:.85rem}
input[type=text],input[type=password],input[type=number],input:not([type]){width:100%;padding:10px;margin:3px 0;border-radius:4px;border:1px solid var(--sf2);background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{width:100%;accent-color:var(--gd)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pl{padding:14px 8px;border-radius:4px;border:1.5px solid var(--sf2);background:var(--sf);font:400 1.2rem Lalezar,sans-serif;display:flex;flex-direction:column;align-items:center}
.pl:nth-child(odd){transform:rotate(-.8deg)}.pl:nth-child(even){transform:rotate(.7deg)}
.pl span{font:400 .75rem Almarai,sans-serif;color:var(--mu)}
.pl.done{opacity:.4}.pl.sel{border-color:var(--gd);background:var(--sf2)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.bar .acts{display:flex;gap:6px;flex-wrap:wrap}
.bar button{padding:6px 10px;border-radius:4px;border:1px solid var(--gd);background:none;color:var(--gd);font-size:.88rem}
.tag{color:var(--gd);font-size:1.15rem}
.ann{font-size:1.15rem;border-right:4px solid var(--ac);padding-right:12px;margin:10px 0}
.nar-box{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sf2);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:.86rem;color:var(--tx);border:1px solid #d4af3744}
.nar-box .acts{display:flex;gap:6px;flex-wrap:wrap}
.nar-box button{background:none;border:1px solid var(--gd);color:var(--gd);border-radius:4px;padding:4px 10px;font-size:.82rem}
.tm{font-size:4rem;text-align:center;color:var(--gd);line-height:1.2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{width:min(68vw,250px);aspect-ratio:63/88;border-radius:12px;margin:14px auto;display:grid;place-items:center;text-align:center;padding:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}

<body>
<div class="w" id="app"></div>
<div id="modal"><div id="mb"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const R={
cit:{n:'مواطن',d:'ما عندك قدرة. اتكلم، صوّت، وشوف منو المافيا.'},
may:{n:'العمدة',d:'صوتك في النهار يُحسب بصوتين وقت التصويت.'},
law:{n:'المحامي',d:'مرة وحدة في اللعبة تحصّن لاعب ضد الإقصاء بالتصويت.'},
obs:{n:'المراقب',d:'كل ليلة تراقب لاعب وتعرف هل استُهدف ليلاً أم لا.'},
doc:{n:'الدكتور',d:'كل ليلة تنقذ واحد من القتل.'},
snp:{n:'القناص',d:'عندك طلقة وحدة طول اللعبة. تصيب مافيا يموت، تغلط تموت انت.'},
inv:{n:'المحقق',d:'كل ليلة تسأل الحكم على واحد: مافيا ولا لا.'},
grd:{n:'الحارس',d:'تحمي واحد كل ليلة، وإذا جاه القتل تموت انت بداله.'},
hnt:{n:'الصيّاد',d:'إذا طلّعوك بالتصويت، تضرب واحد قبل ما تروح.'},
jok:{n:'المهرج',d:'تغلب إذا الربع صوّتوا عليك وطلّعوك.'},
mf:{n:'مافيا',d:'مافيا عادي، بلا قدرة. غطّي على ربعك.'},
mk:{n:'مافيا (قتل)',d:'تقتل واحد كل ليلة.'},
ms:{n:'مافيا (إسكات)',d:'تسكّت واحد، ما يتكلمش نهار اليوم اللي بعده.'},
mks:{n:'مافيا (قتل وإسكات)',d:'تقتل وتسكّت.'}};

const GA=['cit','may','law','obs','doc','snp','inv','grd','hnt','jok'],GB=['mf','mk','ms','mks'],RK=[...GA,...GB];
const PRE=[['رزمتك (12)',{cit:7,doc:1,snp:1,mk:1,ms:1,mks:1}],['9 لاعبين',{cit:5,doc:1,snp:1,mk:1,mks:1}],['7 لاعبين',{cit:3,doc:1,snp:1,mk:1,mks:1}]];

/* حوارات الراوي الدرامية بأسلوب الجلسات الحماسية */
const SX={
kill:['دور المافيا','يا مافيا... افتحوا عيونكم بهدوء. اتفقوا بينكم، واختاروا لاعبًا واحدًا يكون هدف الليلة. خذوا وقتكم، وبعدها غمّضوا عيونكم.'],
sil:['دور الإسكات','صاحب قدرة الإسكات... افتح عينك وحدد اللاعب اللي تبي تمنعه من الكلام خلال النهار القادم. تم الاختيار؟ ممتاز، غمّض عينك.'],
doc:['الدكتور يفتح عينيه','يا دكتور... المدينة محتاجة مساعدتك. افتح عينك، وفكّر: من اللاعب اللي تبي تحميه الليلة؟ أشر عليه، وبعدها غمّض عينك.'],
grd:['الحارس يفتح عينيه','يا حارس المدينة... افتح عينك. اختار لاعبًا واحدًا تحميه الليلة، ولو وصل له الخطر تكون أنت في طريقه. تم؟ غمّض عينك.'],
obs:['المراقب يفتح عينيه','يا مراقب... افتح عينك وحدد شخصًا تراقبه. الحكم سيخبرك إن كان أحد قد استهدفه أو اقترب منه هذه الليلة.'],
inv:['المحقق يفتح عينيه','يا محقق... حان وقت كشف الحقيقة. افتح عينك، واختر لاعبًا تشك في أمره. ستعرف الآن إن كان من المافيا أم لا.'],
snp:['القناص يفتح عينيه','يا قناص... هذه فرصتك، لكن تذكّر: لديك طلقة واحدة فقط. اختر هدفك بحذر، أو احتفظ بها لليلة أخرى.']};

// لا تعتمد على الحرف الأول: دور العمدة (may) يبدأ بحرف m وليس من المافيا.
const isM=r=>GB.includes(r);
const SINGLETON_ROLES=['may','law','obs','doc','snp','inv','grd','hnt','jok'];
const cleanCounts=raw=>Object.fromEntries(RK.map(k=>{
  const n=Number(raw&&raw[k]);
  return [k,Number.isFinite(n)?Math.max(0,Math.min(20,Math.floor(n))):0];
}));
const lc=()=>{try{return JSON.parse(localStorage.getItem('mafia.c'))}catch(e){return null}};
let D={c:cleanCounts(lc()||PRE[0][1]),names:[],pin:'',rev:1,eventName:''};
try{const savedSetup=JSON.parse(localStorage.getItem('mafia.setup')||'null');if(savedSetup&&typeof savedSetup==='object')D={...D,...savedSetup,c:cleanCounts({...D.c,...(savedSetup.c||{})})}}catch(e){}
D.c=cleanCounts(D.c);D.names=Array.isArray(D.names)?D.names.slice(0,20).map(x=>String(x||'').slice(0,14)):[];
D.eventName=String(D.eventName||'').slice(0,50);D.pin='';D.rev=D.rev?1:0;
const saveSetup=()=>{try{const safe={...D,pin:''};localStorage.setItem('mafia.setup',JSON.stringify(safe));localStorage.setItem('mafia.c',JSON.stringify(D.c))}catch(e){}};
let G=null,V='setup',timer=null,left=0,sel=null,U=[],lastNarr='';
const tot=()=>RK.reduce((a,k)=>a+(D.c[k]||0),0),mc=()=>GB.reduce((a,k)=>a+(D.c[k]||0),0);

/* ---------- خلط الأوراق ---------- */
function rnd(n){
  if(!Number.isInteger(n)||n<=1)return 0;
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;
    let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=limit);
    return x%n;
  }
  return Math.floor(Math.random()*n);
}
function shuffle(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){const j=rnd(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
}

async function H(s){if(!window.crypto||!crypto.subtle||!crypto.subtle.digest)throw new Error('Secure hashing is unavailable');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mafia:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const st=()=>{try{const v=JSON.parse(localStorage.getItem('mafia.st')||'{}')||{};return{g:Math.max(0,Math.floor(Number(v.g)||0)),m:Math.max(0,Math.floor(Number(v.m)||0)),c:Math.max(0,Math.floor(Number(v.c)||0))}}catch(e){return{g:0,m:0,c:0}}};
const sv=()=>{try{localStorage.setItem('mafia.g',JSON.stringify({G,V,left:Math.max(0,Math.floor(Number(left)||0))}))}catch(e){}};
const ld=()=>{try{return JSON.parse(localStorage.getItem('mafia.g'))}catch(e){return null}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2600)}
function M(h){$('#mb').innerHTML=h;$('#modal').style.display='block'}
function cm(){$('#modal').style.display='none';$('#mb').innerHTML=''}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}

function applyMood(){
  document.body.classList.remove('mood-night','mood-day');
  if(!G||V=='setup'||V=='deal'||G.phase=='end')return;
  if(G.phase=='night')document.body.classList.add('mood-night');
  else document.body.classList.add('mood-day');
}

function render(){
  if(timer&&!(G&&(G.phase=='day'||G.phase=='lw'))){clearInterval(timer);timer=null}
  applyMood();
  V=='card'?cardView():V=='stats'?stats():V=='guide'?guide():V=='setup'?setup():V=='deal'?deal():({night,day,hunt,end,vote:vsheet,lw})[G.phase]();
}

/* ---------- setup ---------- */
function cnt(k,d){
  if(d>0&&SINGLETON_ROLES.includes(k)&&(D.c[k]||0)>=1)return toast('هذا الدور يُستخدم مرة واحدة فقط في النسخة الحالية');
  const v=Math.max(0,(D.c[k]||0)+d);
  if(d>0&&tot()>=20)return toast('الحد الأقصى 20 لاعب');
  D.c[k]=v;saveSetup();setup()
}
const row=k=>`<div class="rl"><div><b>${R[k].n}</b><span>${R[k].d}</span></div><div class="stp"><button aria-label="نقّص ${R[k].n}" onclick="cnt('${k}',-1)">−</button><i>${D.c[k]||0}</i><button aria-label="زيّد ${R[k].n}" onclick="cnt('${k}',1)">+</button></div></div>`;

function homeHero(){
  return `<header class="home-hero" aria-label="واجهة حَكَم مافيا">
    <div class="hero-topbar">
      <button class="hero-action" type="button" onclick="audioPanel()">الصوت</button>
      <button class="hero-action" type="button" onclick="go('guide')">دليل الأدوار والقوانين</button>
    </div>
    <div class="hero-kicker">STREET MAFIA EDITION</div>
    <h1 class="hero-title">HAKAM MAFIA</h1>
    <p class="hero-subtitle">حَكَم المافيا — الجلسة الاحترافية في جوالك</p>
    <div class="hero-credit">إعداد وتطوير: عبدالرحمن محمد ضو</div>
    <div class="hero-mottos">
      <span class="hero-motto red">قانون أساسي: ممنوع الحلف</span>
      <span class="hero-motto gold">إذا سكت روحك مش راجل!</span>
    </div>
    <p class="hero-lead">جوال واحد يدير الطاولة الدائرية. يوزّع الأدوار بسرية تامة، ويحكم الليل والنهار.</p>
  </header>`;
}

function setup(){
  const r=ld(),s=st(),n=tot();
  const vs=getArabicVoices();
  $('#app').innerHTML=`${homeHero()}
<div class="hero-install"><button class="btn gold" type="button" onclick="installApp()">تثبيت HAKAM MAFIA كتطبيق</button></div>
${r&&r.G&&r.V!='setup'&&r.G.phase!='end'?`<button class="btn gold" onclick="resume()">كمّل اللعبة اللي فاتت</button>`:''}
<div class="card"><div class="tot"><h3>الورق في هالجولة</h3><span class="big">${n}</span></div><p class="mu">المجموع هو عدد اللاعبين، وكل ما تزيد ورقة يزيد لاعب.</p>

  unlockAudio();

  say(line,{mood:'adnan',force:true});

async function startGame(){
  unlockAudio();
  const n=tot(),m=mc();
  if(!Number.isInteger(n)||n<4)return toast('الأقل 4 لاعبين');
  if(n>20)return toast('الحد الأقصى 20 لاعبًا');
  if(SINGLETON_ROLES.some(k=>(D.c[k]||0)>1))return toast('الأدوار الخاصة الفريدة لا تتكرر في هذه النسخة');
  if(!m)return toast('لازم مافيا واحد على الأقل');
  if(!(D.c.mk||D.c.mks))return toast('أضف دور مافيا قادرًا على القتل (مافيا قتل أو قتل وإسكات)');
  if(m>=n-m)return toast('لازم الباقي يكون أكثر من المافيا');
  if(D.pin&&!/^\d{4}$/.test(D.pin))return toast('الرمز لازم 4 أرقام');
  if(D.pin&&(!window.crypto||!crypto.subtle))return toast('حماية الرمز تحتاج متصفحًا يدعم التشفير؛ افتح اللعبة عبر HTTPS أو اترك الرمز فارغًا');
  saveSetup();
  const rawRoles=RK.flatMap(k=>Array(D.c[k]||0).fill(k));
  if(rawRoles.length!==n)return toast('هناك خلل في عدد الأدوار؛ أعد ضبط الرزمة');
  const roles=shuffle(rawRoles);
  const playerNames=Array.from({length:n},(_,i)=>(D.names[i]||'').trim()||'لاعب '+(i+1));
  const nameKeys=playerNames.map(x=>x.normalize('NFKC').toLocaleLowerCase());
  if(new Set(nameKeys).size!==n)return toast('اجعل أسماء اللاعبين مختلفة حتى لا تختلط إحصائياتهم');
  G={
    n,rot:rnd(n),qr:0,cur:-1,lv:n>14&&innerWidth<500,eventName:D.eventName.trim(),
    names:playerNames,
    roles,dealt:[],alive:roles.map(()=>1),sil:-1,lawUsed:0,
    round:1,used:0,log:[],events:[],t0:Date.now(),
    pin:D.pin?await H(D.pin):'',rev:D.rev,phase:'night',N:{},s:0,ann:'',win:'',vt:null,pendingSecret:null,pendingLaw:null
  };
  U.length=0;left=0;V='deal';wake();sv();toast('تم خلط الأوراق بنجاح');render();
}
function resume(){
  unlockAudio();
  const saved=ld(),x=saved&&saved.G,view=saved&&saved.V;
  const baseValid=x&&Number.isInteger(x.n)&&x.n>=4&&x.n<=20&&Array.isArray(x.roles)&&x.roles.length===x.n&&x.roles.every(k=>RK.includes(k))&&Array.isArray(x.names)&&x.names.length===x.n&&x.names.every(n=>typeof n==='string')&&Array.isArray(x.alive)&&x.alive.length===x.n&&x.alive.every(v=>v===0||v===1||v===true||v===false)&&Array.isArray(x.dealt)&&x.dealt.every(i=>Number.isInteger(i)&&i>=0&&i<x.n);
  const dealValid=view==='deal'&&baseValid&&x.phase==='night';
  const gamePhases=['night','day','hunt','end','vote','lw'];
  const gameValid=view==='game'&&baseValid&&gamePhases.includes(x.phase);
  if(!dealValid&&!gameValid){toast('لا توجد جلسة محفوظة صالحة أو أن بياناتها غير مكتملة');return}
  if(gameValid&&x.phase==='end'&&!['maf','cit','jok'].includes(x.win)){toast('نتيجة الجلسة المحفوظة غير صالحة');return}
  G=x;V=view;
  if(V==='game'){
    if(G.phase==='night'){
      if(!Array.isArray(G.steps)||!G.steps.every(k=>['kill','sil','doc','grd','snp','obs','inv'].includes(k))||!Number.isInteger(G.s)||G.s<0||G.s>G.steps.length){toast('بيانات مرحلة الليل غير مكتملة؛ ابدأ جولة جديدة');return}
      if(!G.N||typeof G.N!=='object')G.N={};
    }
    if(G.phase==='vote'){if(!G.vs||typeof G.vs!=='object')G.vs={v:{}};if(!G.vs.v||typeof G.vs.v!=='object'||Array.isArray(G.vs.v))G.vs.v={};if(Array.isArray(G.vs.c))G.vs.c=G.vs.c.filter(i=>Number.isInteger(i)&&i>=0&&i<G.n&&G.alive[i]);}
    if(!Array.isArray(G.log))G.log=[];
    if(!Array.isArray(G.events))G.events=[];
    if(!Number.isInteger(G.round)||G.round<1)G.round=1;
    if(!G.N||typeof G.N!=='object'||Array.isArray(G.N))G.N={};
    if(!Number.isInteger(G.cur))G.cur=-1;
    if(!Number.isInteger(G.sil))G.sil=-1;
    G.alive=G.alive.map(v=>v?1:0);
  }
  const fallback=G.phase==='lw'?30:G.phase==='day'?S.disc:0;
  left=Math.max(0,Math.min(600,Math.floor(Number(saved.left??fallback)||0)));
  wake();sv();render();
  if(G.pendingSecret)showNightSecret();else if(G.pendingLaw!==null&&G.pendingLaw!==undefined)showPendingLaw();
}

/* ---------- الطاولة الدائرية ---------- */
function tbl(nm,f,rot=0){
  const n=nm.length,R=.34,w=n<2?20:Math.max(9,Math.min(20,2*R*Math.sin(Math.PI/n)*92)),tiny=w<12.5;
  return`<div class="tb${tiny?' tiny':''}"><div class="lg0">HAKAM<br>MAFIA</div>${nm.map((s,i)=>{
    const o=f(i),an=2*Math.PI*((i+rot)%n)/n-Math.PI/2,tg=o.a?'button':'div';
    return`<${tg} ${o.a?`onclick="${o.a}"`:''} ${o.title?`title="${esc(o.title)}"`:''} ${o.a?'':'aria-disabled="true"'} class="st ${o.c||''}" style="--w:${w.toFixed(1)};left:${(50+R*100*Math.cos(an)).toFixed(1)}%;top:${(50+R*100*Math.sin(an)).toFixed(1)}%"><b>${i+1}</b><span>${esc(s)}${o.t?`<em>${esc(o.t)}</em>`:''}</span></${tg}>`;
  }).join('')}</div>`+(tiny?`<p class="lg">${nm.map((s,i)=>`${i+1} ${esc(s)}`).join(' · ')}</p>`:'');
}
function T(act,s,done,lk=1,blockedLabel=null){
  const dn=i=>!!(done&&done(i)),
  reason=i=>blockedLabel?blockedLabel(i):'',
  cl=i=>(G.alive[i]?'':'dead ')+(dn(i)&&lk?'done blocked ':'')+(s===i?'sel ':'')+(G.sil===i?'sil ':'')+(G.cur===i&&(G.phase=='day'||G.phase=='lw')?'cur ':''),
  ac=i=>G.alive[i]&&!(dn(i)&&lk)?act(i):'',
  tg=`<button class="btn gold" onclick="G.lv=!G.lv;render()">${G.lv?'عرض الطاولة':'عرض قائمة'}</button>`;
  if(G.lv)return`<div class="grid">${G.names.map((n,i)=>{const a=ac(i),t=a?'button':'div',why=reason(i);return`<${t} ${a?`onclick="${a}"`:''} class="pl ${cl(i)}" ${!a?'aria-disabled="true"':''}>${esc(n)}${why?`<small class="pl-note">${esc(why)}</small>`:G.sil===i?'<span>متسكّت</span>':''}</${t}>`}).join('')}</div>`+tg;
  return tbl(G.names,i=>({c:cl(i),a:ac(i),t:reason(i)||(G.sil===i?'متسكّت':''),title:reason(i)||''}),G.rot||0)+tg;
}
function rot(d){if(!G||V!=='deal'||!Number.isInteger(d))return;G.rot=((G.rot||0)+d+G.n)%G.n;sv();deal()}

/* ---------- توزيع الورق ---------- */
function deal(){
  const k=G.dealt.length,online=/^https?:\/\//i.test(location.href);
  if(!online)G.qr=0;
  $('#app').innerHTML=`<div class="fl"></div><h2>توزيع الورق</h2><p class="mu">اضغط على مقعدك، ثم اضغط مطولًا على البطاقة لكشف دورك. تأكد أن الشاشة لا يراها بقية اللاعبين.</p>
${T(i=>`peek(${i})`,null,i=>G.dealt.includes(i),1)}<div class="two"><button class="btn gold" onclick="rot(1)">دوّر الجلسة</button>${online?`<button class="btn gold" onclick="G.qr=G.qr?0:1;sv();deal()">${G.qr?'توزيع بتمرير الجوال':'توزيع بـ QR'}</button>`:`<button class="btn gold" onclick="toast('ميزة QR تتطلب فتح اللعبة من رابط HTTPS منشور')">معلومة QR</button>`}</div>${G.qr?'<p class="mu">كل لاعب يمسح الرمز من هاتفه لفتح بطاقته. من يحصل على الرابط يستطيع رؤية الدور، لذلك لا تعرض الرمز إلا لصاحبه.</p>':!online?'<p class="mu">التوزيع بتمرير الهاتف يعمل دون إنترنت. لفتح بطاقة QR على هاتف آخر، انشر اللعبة أولًا على رابط HTTPS.</p>':''}
${k==G.n?`<button class="btn red" onclick="startNight()">ابدأ الليلة الأولى</button>`:`<p class="mu">${k} من ${G.n} استلموا أوراقهم</p>`}`;
}
function peek(i){
  if(!G||V!=='deal'||!Number.isInteger(i)||i<0||i>=G.n||G.dealt.includes(i))return toast('هذه البطاقة استلمها اللاعب بالفعل أو أن المقعد غير صحيح');
  if(G.qr)return qrm(i);window._r=R[G.roles[i]];
  M(`<p class="mu" style="text-align:center">${esc(G.names[i])}</p>
<div id="cd" class="cd back" onpointerdown="sh(1)" onpointerup="sh(0)" onpointerleave="sh(0)" onpointercancel="sh(0)" oncontextmenu="return false"><span id="cf">دوس مطوّل تشوف دورك</span></div>
<button class="btn" onclick="fin(${i})">خلاص — سلّم الجوال</button>`);
}
function sh(v){const c=$('#cd');if(!c)return;const r=window._r;c.className='cd '+(v?'front':'back');c.innerHTML=v?`<b>${r.n}</b><small>${r.d}</small>`:'<span id="cf">دوس مطوّل تشوف دورك</span>'}
function fin(i){if(!G||V!=='deal'||!Number.isInteger(i)||i<0||i>=G.n)return toast('مقعد غير صالح');if(!G.dealt.includes(i))G.dealt.push(i);cm();sv();deal()}
function startNight(){if(!G||V!=='deal'||G.dealt.length!==G.n)return toast('يجب أن يستلم جميع اللاعبين بطاقاتهم أولاً');unlockAudio();V='game';nightInit();render()}

/* ---------- الليل ---------- */
const al=()=>G.names.map((_,i)=>i).filter(i=>G.alive[i]);
function nightInit(){
  G.phase='night';G.N={};G.s=0;G.pendingSecret=null;G.pendingLaw=null;sel=null;beep('night');
  sayOnce('n'+G.round,`حلّت الليلة ${G.round} على المدينة.. الكل يغمض عيونه، لا صوت ولا حركة.`,{mood:'adnan'});
  const s=[],h=f=>G.roles.some((r,i)=>G.alive[i]&&f(r));
  if(h(r=>r==='mk'||r==='mks'))s.push('kill');
  if(h(r=>r==='ms'||r==='mks'))s.push('sil');
  if(h(r=>r==='doc'))s.push('doc');
  if(h(r=>r==='grd'))s.push('grd');
  // Resolve the sniper's choice before the observer checks the night's activity.
  if(h(r=>r==='snp')&&!G.used)s.push('snp');
  if(h(r=>r==='obs'))s.push('obs');
  if(h(r=>r==='inv'))s.push('inv');
  G.steps=s;sv();
}

// One source of truth for all night target restrictions.
function nightTargetReason(action,i){
  if(!G||!Number.isInteger(i)||i<0||i>=G.n)return 'اختيار غير صالح';
  if(!G.alive[i])return 'خرج من اللعبة';
  if((action==='kill'||action==='sil')&&isM(G.roles[i]))return 'من المافيا — لا يجوز استهداف زميل';
  if(action==='sil'&&G.N&&G.N.kill===i)return 'تم اختياره للقتل هذه الليلة';
  if(action==='snp'){
    const sniperIndex=G.roles.findIndex((r,idx)=>r==='snp'&&G.alive[idx]);
    if(sniperIndex<0)return 'القناص غير متاح';
    if(i===sniperIndex)return 'القناص لا يستهدف نفسه';
  }
  return '';
}
const narBar=()=>`<div class="nar-box"><span>🎙️ الراوي: ${S.nar?'شغّال':'مكتوم'}</span><div class="acts"><button onclick="repeatNar()">أعد الصوت</button><button onclick="toggleNar()">${S.nar?'كتم':'تشغيل'}</button></div></div>`;
const bar=()=>`<div class="fl"></div><div class="bar"><span class="tag">الجولة ${G.round} · باقي ${al().length}</span><div class="acts"><button onclick="undo()">تراجع</button><button onclick="panel()">لوحة الحكم</button></div></div>`;

function night(){
  const k=G.steps[G.s];
  if(!k){
    sayOnce('e'+G.round,'انتهت تحركات الليل.. الكل مغمض، واستعدوا لطلوع الفجر!',{mood:'adnan'});
    $('#app').innerHTML=bar()+narBar()+`<h2>الليل خلص</h2><p class="mu">الكل لسا مغمّض عيونه. كي تكون جاهز، قلّهم يفتّحو.</p><button class="btn red" onclick="dawn()">طلّع الفجر</button>`;
    return;
  }
  const t=SX[k];
  sayOnce(G.round+'.'+G.s,t[1],{mood:'adnan'});
  const reason=i=>nightTargetReason(k,i);
  const blocked=i=>!!reason(i);
  const hint=(k==='kill'||k==='sil')
    ?'لا يمكن اختيار أي لاعب من المافيا. وفي الإسكات لا يمكن اختيار ضحية القتل نفسها.'
    :k==='snp'?'القناص لا يستطيع استهداف نفسه. يمكنه استهداف أي لاعب حي آخر.':'اختر لاعبًا حيًا، أو تخطَّ القدرة إن لم ترغب باستخدامها.';
  $('#app').innerHTML=bar()+narBar()+`<h2>${t[0]}</h2><p class="ann">${t[1]}</p><div class="night-rule">${hint}</div>
${T(i=>`sel=${i};night()`,sel,blocked,1,reason)}
<button class="btn red" ${sel==null?'disabled':''} onclick="nx(sel)">تمام — يغمّض عينيه</button>
<button class="btn gold" onclick="nx(null)">${k==='snp'?'يحتفظ بالرصاصة':'تجاوز هذا الدور'}</button>`;
}

function nx(v){
  if(!G||G.phase!=='night'||!Array.isArray(G.steps)||!G.steps[G.s])return toast('لا يوجد اختيار ليلي مفتوح الآن');
  const k=G.steps[G.s];
  if(v!==null&&v!==undefined){
    v=Number(v);
    const reason=nightTargetReason(k,v);
    if(reason)return toast(`لا يمكن اعتماد هذا الاختيار: ${reason}`);
  }else v=null;
  snap();G.N[k]=v;G.s++;sel=null;sv();
  if(k==='inv'&&v!=null){
    G.pendingSecret={type:'inv',target:v,mafia:isM(G.roles[v])};sv();showNightSecret();return;
  }
  if(k==='obs'&&v!=null){
    const targeted=(G.N.kill===v)||(G.N.sil===v)||(G.N.doc===v)||(G.N.grd===v)||(G.N.snp===v);
    G.pendingSecret={type:'obs',target:v,targeted};sv();showNightSecret();return;
  }
  night();
}
function showNightSecret(){
  const p=G&&G.pendingSecret;if(!p||!Number.isInteger(p.target)||p.target<0||p.target>=G.n)return;
  if(p.type==='inv'){
    M(`<h2>${esc(G.names[p.target])}</h2><p class="ann">${p.mafia?'مافيا. ارفع إبهامك لفوق للمحقق.':'مو مافيا. نزّل إبهامك للمحقق.'}</p><button class="btn red" onclick="closeNightSecret()">خلاص</button>`);
  }else if(p.type==='obs'){
    M(`<h2>مراقبة ${esc(G.names[p.target])}</h2><p class="ann">${p.targeted?'نعم، تم استهدافه أو لمسه ليلاً. أومئ للمراقب.':'لا، لم يقترب منه أحد هذه الليلة.'}</p><button class="btn red" onclick="closeNightSecret()">خلاص</button>`);
  }
}
function closeNightSecret(){if(!G||!G.pendingSecret)return;G.pendingSecret=null;sv();cm();night()}

function resolveNightDeaths(N=G.N){
  const deaths=[];
  const aliveIndex=i=>Number.isInteger(i)&&i>=0&&i<G.n&&!!G.alive[i];
  const target=N.kill;
  if(aliveIndex(target)&&!isM(G.roles[target])){
    const savedByDoctor=N.doc===target&&aliveIndex(N.doc);
    const savedByGuard=N.grd===target&&aliveIndex(N.grd);
    if(!savedByDoctor){
      if(savedByGuard){
        const guardIndex=G.roles.findIndex((r,i)=>r==='grd'&&G.alive[i]);
        deaths.push(guardIndex>=0?guardIndex:target);
      }else deaths.push(target);
    }
  }
  if(aliveIndex(N.snp)){
    const sniperIndex=G.roles.findIndex((r,i)=>r==='snp'&&G.alive[i]);
    if(sniperIndex>=0&&N.snp!==sniperIndex){
      G.used=1;
      if(isM(G.roles[N.snp]))deaths.push(N.snp);
      else deaths.push(sniperIndex);
    }
  }
  return [...new Set(deaths.filter(aliveIndex))];
}
function dawn(){
  if(!G||G.phase!=='night'||!Array.isArray(G.steps)||G.s<G.steps.length)return toast('لم تنتهِ إجراءات الليل بعد');
  snap();const N=G.N;const d=resolveNightDeaths(N);
  d.forEach(i=>G.alive[i]=0);
  G.sil=N.sil!=null&&G.alive[N.sil]&&!isM(G.roles[N.sil])?N.sil:-1;
  G.ann=(d.length?`طاح الليلة: ${nm(d)}.`:'ليلة عدّت بسلام، ما مات حد.')+(G.sil>=0?` ${G.names[G.sil]} متسكّت طول النهار.`:'');
  G.log.push(`الجولة ${G.round} — ${G.ann}`);
  G.events.push({r:G.round,type:'dawn',dead:d.slice(),sil:G.sil});
  beep('dawn');
  const speechDawn=d.length
    ?`افتحوا عيونكم.. طلعت الشمس على خبر صادم! ${G.ann}`
    :`افتحوا عيونكم.. صباح الخير يا أهل المدينة، ليلة عدّت بسلام وما خسرنا حد!${G.sil>=0?` لكن ${G.names[G.sil]} ممنوع من الكلام اليوم!`:''}`;
  say(speechDawn,{mood:'adnan'});
  if(!chk()){G.phase='day';left=S.disc;G.vt=null;G.cur=-1;sv();render()}
}
const nm=a=>a.map(i=>G.names[i]+(G.rev?` (${R[G.roles[i]].n})`:'')).join('، ');
function chk(){
  const m=G.roles.filter((r,i)=>G.alive[i]&&isM(r)).length,c=G.roles.filter((r,i)=>G.alive[i]&&!isM(r)).length;
  if(!m)return finish('cit');if(m>=c)return finish('maf');return false;
}
function nextRound(){if(!G||G.phase==='end')return;G.round++;G.sil=-1;G.cur=-1;nightInit();render()}

function tm(){const e=$('#tm');if(e)e.textContent=Math.floor(left/60)+':'+String(Math.max(left,0)%60).padStart(2,'0')}
function tgl(){
  const b=$('#tb');
  if(timer){clearInterval(timer);timer=null;b.textContent='كمّل';sv()}
  else{
    b.textContent='وقّف';sv();
    timer=setInterval(()=>{
      left=Math.max(0,left-1);tm();sv();
      if(left<=0){clearInterval(timer);timer=null;b.textContent='خلص الوقت';beep('tick');say('انتهى الوقت! حان وقت القرار.',{mood:'adnan'});try{navigator.vibrate(600)}catch(e){}}
    },1000);
  }
}

function vote(i){
  if(!G||!['day','vote'].includes(G.phase))return toast('التصويت غير متاح في هذه المرحلة');
  if(G.pendingLaw!==null&&G.pendingLaw!==undefined)return toast('احسم قرار المحامي أولاً');
  if(i!==-1&&(!Number.isInteger(i)||i<0||i>=G.n||!G.alive[i]||(G.phase==='vote'&&G.vs&&Array.isArray(G.vs.c)&&!G.vs.c.includes(i))))return toast('اختيار اللاعب غير صالح أو أنه خرج من اللعبة');
  snap();G.vs=null;if(timer){clearInterval(timer);timer=null}
  if(i<0){
    G.log.push(`الجولة ${G.round} — ما حد خرج`);
    say('انتهى التصويت ولم يخرج أحد اليوم.. التوتر يزداد في المدينة.',{mood:'adnan'});
    return nextRound();
  }
  const hasLaw=!G.lawUsed&&G.roles.some((r,idx)=>G.alive[idx]&&r=='law');
  if(hasLaw){G.pendingLaw=i;sv();showPendingLaw();return;}
  G.pendingLaw=null;proceedElim(i);
}
function showPendingLaw(){
  if(!G||!Number.isInteger(G.pendingLaw)||!G.alive[G.pendingLaw]||G.lawUsed||!G.roles.some((r,idx)=>G.alive[idx]&&r==='law'))return;
  const i=G.pendingLaw;
  M(`<h3>قدرة المحامي</h3><p class="ann">هل يتدخل المحامي ويحصّن <b>${esc(G.names[i])}</b> من الإقصاء هذه المرة؟</p><button class="btn red" onclick="cm();useLawyer(${i})">نعم — حصّنه (تُستخدم مرة واحدة)</button><button class="btn gold" onclick="cm();proceedElim(${i})">لا — يخرج</button>`);
}
function useLawyer(i){
  if(!G||!['day','vote'].includes(G.phase)||!Number.isInteger(i)||i<0||i>=G.n||!G.alive[i]||G.pendingLaw!==i||G.lawUsed||!G.roles.some((r,idx)=>r==='law'&&G.alive[idx]))return toast('لا يمكن استخدام قدرة المحامي الآن');
  G.pendingLaw=null;G.lawUsed=1;
  G.log.push(`الجولة ${G.round} — المحامي تدخّل وأنقذ ${G.names[i]} من الإقصاء`);
  say(`مفاجأة! المحامي يتدخل في اللحظة الأخيرة وينقذ ${G.names[i]} من الإقصاء!`,{mood:'adnan'});
  nextRound();
}
function proceedElim(i){
  if(!G||!['day','vote'].includes(G.phase)||!Number.isInteger(i)||i<0||i>=G.n||!G.alive[i]||(G.pendingLaw!==null&&G.pendingLaw!==undefined&&G.pendingLaw!==i))return toast('هذا اللاعب خرج بالفعل أو أن الاختيار غير صالح');
  G.pendingLaw=null;G.alive[i]=0;beep('out');const r=G.roles[i];
  const line=`الجولة ${G.round} — طلّعوا ${nm([i])}`;
  G.log.push(line);
  G.events.push({r:G.round,type:'vote',out:i,role:r});
  say(`قررت المدينة إقصاء ${G.names[i]}${G.rev?`.. واللي طلع دوره ${R[r].n}!`:'!'}`,{mood:'adnan'});
  if(r=='jok'){G.jn=i;return finish('jok')}
  if(r=='hnt'&&al().length>1){G.phase='hunt';sel=null;sv();return render()}
  if(!chk())S.lw?lastw(i):nextRound();
}

function finish(w){
  if(!G||G.phase==='end'||!['maf','cit','jok'].includes(w))return false;
  G.pendingSecret=null;G.pendingLaw=null;G.phase='end';G.win=w;
  const dur=Math.max(1,Math.round((Date.now()-G.t0)/60000));
  const titleMap={maf:['المافيا غلبت','الشارع صار لهم'],cit:['الربع غلبو المافيا','المدينة نظيفة'],jok:['المهرج ضحك عليكم',G.names[G.jn]+' طلّعوه بالتصويت']}[w];
  try{const statsNow=st();statsNow.g++;w==='maf'?statsNow.m++:w==='cit'&&statsNow.c++;localStorage.setItem('mafia.st',JSON.stringify(statsNow))}catch(e){}
  try{
    const h=hist();
    h.push({
      t:Date.now(),n:G.n,w,r:G.round,m:dur,event:String(G.eventName||''),
      p:G.names.map((x,i)=>[x,G.roles[i],G.alive[i],G.sil===i?1:0])
    });
    localStorage.setItem('mafia.h',JSON.stringify(h.slice(-200)));
  }catch(e){}
  beep('win');
  say(`انتهت الحكاية! ${titleMap[0]}.. ${titleMap[1]}!`,{mood:'adnan'});
  sv();render();return true;
}

/* ---------- QR مُحسّن مع منطقة هادئة وعمل دون إنترنت عبر رابط مدمج ---------- */
const QE=[10,16,26,18,24,16,18,22,22,26],QB=[1,1,1,2,2,4,4,4,5,5];
const gm=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*285);z^=((y>>>i)&1)*x}return z};
function qr(txt){const by=[...new TextEncoder().encode(txt)],raw=q=>{let r=(16*q+128)*q+64;if(q>1){const a=Math.floor(q/7)+2;r-=(25*a-10)*a-55;if(q>6)r-=36}return r>>3};
let v=1,cap;for(;v<=10;v++){cap=raw(v)-QE[v-1]*QB[v-1];if(4+(v<10?8:16)+8*by.length<=cap*8)break}
if(v>10)return null;
const bits=[],put=(x,k)=>{for(let i=k-1;i>=0;i--)bits.push((x>>>i)&1)};
put(4,4);put(by.length,v<10?8:16);by.forEach(b=>put(b,8));put(0,Math.min(4,cap*8-bits.length));
while(bits.length%8)bits.push(0);for(let p=236;bits.length<cap*8;p^=253)put(p,8);
const dat=[];for(let i=0;i<bits.length;i+=8)dat.push(parseInt(bits.slice(i,i+8).join(''),2));
const ne=QE[v-1],nb=QB[v-1],tot=raw(v),ns=nb-tot%nb,sl=Math.floor(tot/nb),gen=Array(ne).fill(0);gen[ne-1]=1;
for(let i=0,r=1;i<ne;i++){for(let j=0;j<ne;j++){gen[j]=gm(gen[j],r);if(j+1<ne)gen[j]^=gen[j+1]}r=gm(r,2)}
const blk=[];for(let i=0,k=0;i<nb;i++){const d=dat.slice(k,k+sl-ne+(i<ns?0:1));k+=d.length;const rem=gen.map(()=>0);
d.forEach(b=>{const f=b^rem.shift();rem.push(0);gen.forEach((c,j)=>rem[j]^=gm(c,f))});if(i<ns)d.push(0);blk.push(d.concat(rem))}
const out=[];for(let i=0;i<blk[0].length;i++)blk.forEach((b,j)=>{if(i!=sl-ne||j>=ns)out.push(b[i])});
const n=17+4*v,m=Array.from({length:n},()=>Array(n).fill(0)),fn=Array.from({length:n},()=>Array(n).fill(0)),sf=(x,y,d)=>{m[y][x]=d?1:0;fn[y][x]=1};
for(let i=0;i<n;i++){sf(6,i,i%2==0);sf(i,6,i%2==0)}
[[3,3],[n-4,3],[3,n-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&x<n&&y>=0&&y<n)sf(x,y,d!=2&&d!=4)}});
const ap=[];if(v>1){const na=Math.floor(v/7)+2,st=Math.ceil((v*4+4)/(na*2-2))*2;ap.push(6);for(let p=n-7;ap.length<na;p-=st)ap.splice(1,0,p)}
ap.forEach((a,i)=>ap.forEach((b,j)=>{if((!i&&!j)||(!i&&j==ap.length-1)||(i==ap.length-1&&!j))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}));
const fmt=k=>{let r=k;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((k<<10)|r)^0x5412,g=i=>(b>>>i)&1;
for(let i=0;i<=5;i++)sf(8,i,g(i));sf(8,7,g(6));sf(8,8,g(7));sf(7,8,g(8));for(let i=9;i<15;i++)sf(14-i,8,g(i));
for(let i=0;i<8;i++)sf(n-1-i,8,g(i));for(let i=8;i<15;i++)sf(8,n-15+i,g(i));sf(8,n-8,1)};
if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const d=(b>>>i)&1,a=n-11+i%3,c=Math.floor(i/3);sf(a,c,d);sf(c,a,d)}}
fmt(0);
for(let i=0,right=n-1;right>=1;right-=2){if(right==6)right=5;for(let vt=0;vt<n;vt++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)==0?n-1-vt:vt;if(!fn[y][x]&&i<out.length*8){m[y][x]=(out[i>>>3]>>>(7-(i&7)))&1;i++}}}
const mf=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
const mask=k=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fn[y][x]&&mf[k](x,y))m[y][x]^=1};
const pen=()=>{let p=0,d=0;for(let a=0;a<n;a++)for(let t=0;t<2;t++){let run=1;for(let b=1;b<n;b++){const c=t?m[b][a]:m[a][b],e=t?m[b-1][a]:m[a][b-1];if(c==e){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}
for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=m[y][x];if(c==m[y][x+1]&&c==m[y+1][x]&&c==m[y+1][x+1])p+=3}
m.forEach(r=>r.forEach(c=>d+=c));return p+(Math.ceil(Math.abs(d*20-n*n*10)/(n*n))-1)*10};
let best=0,bp=1e9;for(let k=0;k<8;k++){mask(k);fmt(k);const p=pen();if(p<bp){bp=p;best=k}mask(k)}
mask(best);fmt(best);return m}

function qsvg(t){
  const m=qr(t);if(!m)return'';const n=m.length,pad=6;let d='';
  m.forEach((r,y)=>{for(let x=0;x<n;x++)if(r[x]){let e=x;while(e<n&&r[e])e++;d+=`M${x+pad} ${y+pad}h${e-x}v1h-${e-x}z`;x=e}});
  return`<svg viewBox="0 0 ${n+pad*2} ${n+pad*2}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#ffffff"/><path d="${d}" fill="#000000"/></svg>`;

function waitForVoices(timeoutMs=2200){

      if(interval)clearInterval(interval);if(timeout)clearTimeout(timeout);
      try{speechSynthesis.removeEventListener('voiceschanged',finish)}catch(e){}

    };

function splitNarration(text){
  const compact=String(text).replace(/\s+/g,' ').trim();
  if(!compact)return[];
  const pieces=compact.match(/[^،؛.!؟:]+[،؛.!؟:]?/gu)||[compact];
  const out=[];
  for(const raw of pieces){
    const p=raw.trim();if(!p)continue;
    if(p.length<=125){out.push(p);continue}
    const words=p.split(/\s+/);let line='';
    for(const word of words){if((line+' '+word).trim().length>105&&line){out.push(line);line=word}else line=(line+' '+word).trim()}
    if(line)out.push(line);
  }
  return out;
}
async function say(t,opts={}){
  if(!t)return;

    toast('تعذّر تشغيل الراوي: واجهة النطق غير متاحة في هذا المتصفح.');return;
  }
  await waitForVoices(2200);
  if(token!==speechToken)return;
  const voice=pickArabicVoice();
  if(!voice){
    toast('لم يعثر Brave على صوت عربي. ثبّت ميزة «تحويل النص إلى كلام» للغة العربية في Windows، ثم اضغط إعادة فحص الأصوات.');
    refreshAudioStatus();return;
  }
  const parts=splitNarration(t),mode=opts.mood||S.tone||'adnan';
  let index=0;
  let baseRate=Math.max(.75,Math.min(1.25,Number(S.rate)||.96));
  let basePitch=1.0;
  if(mode==='adnan'){baseRate*=.98;basePitch=1.02}

  else if(mode==='fast'){baseRate*=1.10;basePitch=1.04}

    if(token!==speechToken||(!S.nar&&!opts.force)||index>=parts.length)return;
    const phrase=parts[index++];

    u.voice=voice;u.lang=voice.lang||'ar-SA';u.volume=Math.max(0,Math.min(1,Number(S.vol)||0));

    u.pitch=Math.max(.8,Math.min(1.2,basePitch+(emphatic?.025:0)));
    u.onend=()=>{if(token!==speechToken)return;const pause=/[.!؟]$/.test(phrase)?420:/[،؛:]$/.test(phrase)?240:130;setTimeout(speakNext,pause)};
    u.onerror=(event)=>{

      const why=event.error==='not-allowed'?'Brave منع تشغيل الصوت. اضغط زر اختبار الصوت بنفسك واسمح بالصوت للموقع.':`تعذّر تشغيل الصوت (${event.error||'خطأ غير معروف'}). جرّب صوتًا عربيًا آخر.`;
      toast(why);
    };
    try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){toast('تعذّر بدء الراوي الصوتي في Brave.')}
  };

}

const hist=()=>{try{const rows=JSON.parse(localStorage.getItem('mafia.h')||'[]');return Array.isArray(rows)?rows.filter(g=>g&&Number.isFinite(Number(g.t))&&Number.isInteger(Number(g.n))&&Number(g.n)>=4&&Number(g.n)<=20&&['maf','cit','jok'].includes(g.w)&&Array.isArray(g.p)&&g.p.length===Number(g.n)&&g.p.every(p=>Array.isArray(p)&&p.length>=3&&typeof p[0]==='string'&&p[0].length<=80&&RK.includes(p[1]))):[]}catch(e){return[]}};
const won=(w,r)=>w=='maf'?isM(r):w=='jok'?r=='jok':!isM(r)&&r!='jok';
const WN={maf:'المافيا',cit:'الربع',jok:'المهرج'};

function exportData(){
  try{
    const payload={st:st(),h:hist(),s:S,c:D.c,setup:{...D,pin:''},exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='hakam-mafia-backup.json';
    a.click();
    toast('تم تصدير البيانات');
  }catch(e){toast('تعذّر التصدير')}
}
function importData(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!data||typeof data!=='object'||(!Array.isArray(data.h)&&!data.st&&!data.s&&!data.c&&!data.setup))throw new Error('bad backup');
      if(Array.isArray(data.h)){
        const valid=data.h.filter(g=>g&&Number.isFinite(Number(g.t))&&Number.isInteger(Number(g.n))&&Number(g.n)>=4&&Number(g.n)<=20&&['maf','cit','jok'].includes(g.w)&&Array.isArray(g.p)&&g.p.length===Number(g.n)&&g.p.every(p=>Array.isArray(p)&&p.length>=3&&typeof p[0]==='string'&&p[0].length<=80&&RK.includes(p[1]))).slice(-200);
        localStorage.setItem('mafia.h',JSON.stringify(valid));
      }
      if(data.st&&typeof data.st==='object'){
        const clean={g:Math.max(0,Math.floor(Number(data.st.g)||0)),m:Math.max(0,Math.floor(Number(data.st.m)||0)),c:Math.max(0,Math.floor(Number(data.st.c)||0))};
        localStorage.setItem('mafia.st',JSON.stringify(clean));
      }
      if(data.s&&typeof data.s==='object'){
        const keys=['snd','nar','lw','disc','spk','vol','rate','tone','vUri'];
        keys.forEach(k=>{if(Object.prototype.hasOwnProperty.call(data.s,k))S[k]=data.s[k]});
        S.disc=Math.max(30,Math.min(600,Number(S.disc)||120));S.spk=Math.max(10,Math.min(180,Number(S.spk)||45));
        S.vol=Math.max(0,Math.min(1,Number(S.vol)||0));S.rate=Math.max(.75,Math.min(1.25,Number(S.rate)||.96));
        if(!['adnan','dramatic','fast'].includes(S.tone))S.tone='adnan';
        localStorage.setItem('mafia.s',JSON.stringify(S));
      }
      if(data.setup&&typeof data.setup==='object'){
        D={...D,...data.setup,pin:'',c:cleanCounts(data.setup.c||data.c||D.c)};
        D.names=Array.isArray(data.setup.names)?data.setup.names.slice(0,20).map(x=>String(x||'').slice(0,14)):[];
        D.eventName=String(data.setup.eventName||'').slice(0,50);D.rev=data.setup.rev?1:0;saveSetup();
      }else if(data.c&&typeof data.c==='object'){D.c=cleanCounts(data.c);saveSetup()}
      toast('تم استيراد البيانات والتحقق منها');
      stats();
    }catch(e){toast('ملف النسخة الاحتياطية غير صالح أو غير مدعوم')}
  };
  rd.onerror=()=>toast('تعذرت قراءة الملف');
  rd.readAsText(file);
}

function buildEventTables(games){
  const map=new Map();
  games.forEach(g=>{
    const name=String(g.event||'').trim();if(!name||!Array.isArray(g.p))return;
    if(!map.has(name))map.set(name,{name,games:0,players:Object.create(null)});
    const ev=map.get(name);ev.games++;
    g.p.forEach(p=>{
      if(!Array.isArray(p)||typeof p[0]!=='string'||!RK.includes(p[1]))return;
      const player=Object.prototype.hasOwnProperty.call(ev.players,p[0])?ev.players[p[0]]:(ev.players[p[0]]={games:0,wins:0,points:0,survivals:0});
      player.games++;
      if(won(g.w,p[1])){player.wins++;player.points+=3}
      if(p[2])player.survivals++;
    });
  });
  return [...map.values()].map(ev=>({...ev,ranking:Object.entries(ev.players).sort((a,b)=>b[1].points-a[1].points||b[1].wins-a[1].wins||b[1].games-a[1].games)})).sort((a,b)=>b.games-a.games);
}
function exportEventAt(index){
  const events=buildEventTables(hist()),ev=events[index];if(!ev)return toast('الفعالية غير موجودة');
  const rows=[['الفعالية','اللاعب','المباريات','الانتصارات','النقاط','مرات النجاة'],...ev.ranking.map(([n,a])=>[ev.name,n,a.games,a.wins,a.points,a.survivals])];
  const csvCell=v=>{let value=String(v);if(/^[\s]*[=+@-]/.test(value))value="'"+value;return '"'+value.replace(/"/g,'""')+'"'};
  const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='hakam-mafia-event.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast('تم تجهيز تقرير الفعالية بصيغة CSV');
}
function clearLocalData(){
  if(!confirm('سيتم مسح الأسماء والإعدادات والإحصائيات والجلسة المحفوظة من هذا المتصفح. هل تريد المتابعة؟'))return;
  try{['mafia.c','mafia.setup','mafia.s','mafia.g','mafia.h','mafia.st'].forEach(k=>localStorage.removeItem(k))}catch(e){}
  D={c:{...PRE[0][1]},names:[],pin:'',rev:1,eventName:''};S={...SD};G=null;V='setup';U.length=0;stopAllSpeech();toast('تم مسح بيانات HAKAM MAFIA من هذا الجهاز');render();
}
function stats(){
  const h=hist(),pl=Object.create(null),rl=Object.create(null),sd={maf:0,cit:0,jok:0};let rs=0,ms=0,totPlayers=0;
  h.forEach(g=>{
    sd[g.w]++;rs+=g.r;ms+=g.m;totPlayers+=g.n;
    g.p.forEach(([nm,r,alive,sil])=>{
      const w=won(g.w,r)?1:0;
      const a=Object.prototype.hasOwnProperty.call(pl,nm)?pl[nm]:(pl[nm]={g:0,w:0,surv:0,sil:0,roles:Object.create(null)});
      a.g++;a.w+=w;if(alive)a.surv++;if(sil)a.sil++;
      a.roles[r]=(a.roles[r]||0)+1;
      const ro=rl[r]=rl[r]||{g:0,w:0};ro.g++;ro.w+=w;
    });
  });
  const pc=a=>a.g?Math.round(100*a.w/a.g)+'%':'0%';
  const ps=Object.entries(pl).sort((x,y)=>y[1].w-x[1].w||y[1].g-x[1].g);
  const best=ps.filter(([,a])=>a.g>=3).sort((x,y)=>y[1].w/y[1].g-x[1].w/x[1].g||y[1].g-x[1].g).slice(0,3);

  $('#app').innerHTML=`<div class="fl"></div><div class="bar"><h2>الإحصائيات</h2><div class="acts"><button onclick="exportData()">تصدير</button><button onclick="$('#impF').click()">استيراد</button><button onclick="back()">رجوع</button></div></div>
<input id="impF" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])">`+(!h.length?'<p class="mu">لسا ما فيش ألعاب مسجّلة. كل لعبة تخلص تنحفظ هنا في جوالك.</p>':`
<div class="card"><h3>الملخص العام</h3>
<p class="lg">الألعاب: ${h.length} · المافيا غلبت ${sd.maf} · الربع غلبو ${sd.cit} · المهرج ${sd.jok}</p>
<p class="lg">متوسط الجولات: ${(rs/h.length).toFixed(1)} · متوسط المدة: ${Math.round(ms/h.length)} دقيقة · متوسط اللاعبين: ${(totPlayers/h.length).toFixed(1)}</p></div>
<div class="card"><h3>أفضل اللاعبين</h3><p class="mu">حسب نسبة الفوز، ولازم 3 ألعاب على الأقل.</p>${best.length?best.map(([n,a])=>`<p class="lg">${esc(n)}: <b>${pc(a)}</b> (${a.w} من ${a.g} · نجا ${a.surv} مرة)</p>`).join(''):'<p class="lg">ما فيش لاعب كمّل 3 ألعاب لحد توا.</p>'}</div>
<div class="card"><h3>سجل اللاعبين</h3><table>${ps.map(([n,a])=>{
  const topR=Object.entries(a.roles).sort((x,y)=>y[1]-x[1])[0];
  return`<tr><td><b>${esc(n)}</b><div class="lg">${topR?`الأكثر: ${R[topR[0]].n} (${topR[1]}) · `:''}نجاة: ${a.surv}</div></td><td>${a.g} لعبة</td><td>${a.w} فوز</td><td>${pc(a)}</td></tr>`;
}).join('')}</table></div>
<div class="card"><h3>الأدوار</h3><table>${RK.filter(k=>rl[k]).map(k=>`<tr><td>${R[k].n}</td><td>${rl[k].g} مرة</td><td>${pc(rl[k])} فوز</td></tr>`).join('')}</table></div>
<div class="card"><h3>دوري الفعاليات</h3><p class="mu">تجميع محلي لنتائج الألعاب التي سُجل لها اسم فعالية. الفوز = 3 نقاط، والترتيب إحصائي وليس تصنيفًا رسميًا.</p>${buildEventTables(h).length?buildEventTables(h).map((ev,i)=>`<div class="card"><div class="tot"><b>${esc(ev.name)}</b><span class="badge">${ev.games} جلسة</span></div><table class="score-table"><thead><tr><th>اللاعب</th><th>النقاط</th><th>فوز</th><th>مباريات</th></tr></thead><tbody>${ev.ranking.slice(0,8).map(([n,a])=>`<tr><td>${esc(n)}</td><td>${a.points}</td><td>${a.wins}</td><td>${a.games}</td></tr>`).join('')}</tbody></table><button class="btn gold" onclick="exportEventAt(${i})">تنزيل تقرير الفعالية CSV</button></div>`).join(''):'<p class="lg">لا توجد فعاليات مسجلة بعد. اكتب اسم الفعالية قبل بدء اللعبة.</p>'}</div>
<div class="card"><h3>آخر الألعاب</h3>${h.slice(-12).reverse().map(g=>`<p class="lg">${new Date(g.t).toLocaleDateString('ar')} · ${g.n} لاعب · ${WN[g.w]} · ${g.r} جولات · ${g.m} د</p>`).join('')}</div>
<button class="btn gold" onclick="if(confirm('تمسح كل الإحصائيات؟')){try{localStorage.removeItem('mafia.h');localStorage.removeItem('mafia.st')}catch(e){}stats()}">مسح الإحصائيات</button><button class="btn" onclick="clearLocalData()">مسح جميع بيانات هذا الجهاز</button>`);
}

cit:['المواطنين','نهاراً: نقاش وتصويت','لا قدرة ليلية.','تشك في واحد وتقنع الباقي يطلّعوه.'],
may:['المواطنين','نهاراً: وقت التصويت','صوتك يُحسب بصوتين عند احتساب الأصوات.','ترجّح كفة تصويت حاسم في لحظة متقاربة.'],
law:['المواطنين','نهاراً: عند إعلان الإقصاء','مرة واحدة في اللعبة تحصّن متهماً من الخروج بالتصويت.','تتدخل لإنقاذ بريء اشتبه به الجميع.'],
obs:['المواطنين','ليلاً','تعرف هل تم استهداف اللاعب المراقَب ليلاً أم لا.','تراقب لاعباً لتعرف هل اقتربت منه المافيا أو المنقذ.'],
doc:['المواطنين','ليلاً','ينقذ لاعباً واحداً كل ليلة، ويقدر ينقذ نفسه.','لو المافيا اختارت أحمد والدكتور اختاره، ما يموت حد.'],

inv:['المواطنين','ليلاً','يعرف إن كان الهدف مافيا أم لا (المهرج يظهر غير مافيا).','يسأل عن سالم فيرفع الحكم إبهامه لفوق: مافيا.'],
grd:['المواطنين','ليلاً','يحمي لاعباً؛ إن اختارته المافيا للقتل يموت الحارس بداله.','يحمي الدكتور فتختاره المافيا: يموت الحارس ويعيش الدكتور.'],
hnt:['المواطنين','نهاراً، عند إقصائه بالتصويت','يضرب لاعباً قبل أن يخرج (لا يعمل إن مات ليلاً).','يطلّعوه بالتصويت فيضرب اللي يشك فيه.'],

mf:['المافيا','—','عضو مافيا بلا قدرة، ويحسب مع المافيا في الغلبة.','يدافع عن زملائه في النقاش.'],
mk:['المافيا','ليلاً','يقتل لاعباً كل ليلة.','المافيا تتفق بصمت على ضحية الليلة.'],
ms:['المافيا','ليلاً','يُسكِت لاعباً فلا يتكلم في نهار اليوم التالي.','يسكّت المحقق حتى ما يدافع عن نتيجته.'],
mks:['المافيا','ليلاً','يجمع القتل والإسكات.','يقتل واحداً ويسكّت آخر في الليلة نفسها.']};

function guide(){$('#app').innerHTML=`<div class="fl"></div><div class="bar"><h2>دليل الأدوار</h2><button onclick="back()">رجوع</button></div>`+RK.map(k=>`<div class="card"><h3>${R[k].n} <span class="mu">— ${RG[k][0]}</span></h3><p class="lg">${R[k].d}</p><p class="lg">الوقت: ${RG[k][1]}</p><p class="lg">الشرط: ${RG[k][2]}</p><p class="lg">مثال: ${RG[k][3]}</p></div>`).join('')}

addEventListener('hashchange',()=>location.reload());

window.addEventListener('error',e=>{console.error('HAKAM MAFIA error:',e.error||e.message);try{toast('حدث خطأ غير متوقع. أعد تحميل الصفحة، وإذا تكرر أرسل لقطة من وحدة التحكم.')}catch(_){}});
window.addEventListener('unhandledrejection',e=>{console.error('HAKAM MAFIA rejection:',e.reason);try{toast('تعذّر إكمال إحدى العمليات. حاول مرة أخرى.')}catch(_){}});

if(/^#c=/.test(location.hash)){V='card';try{const a=unb(location.hash.slice(3)).split('|');window._c=R[a[0]]&&a.length>2?{r:a[0],s:a[1],n:a.slice(2).join('|')}:null}catch(e){window._c=null}}

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('تم تثبيت HAKAM MAFIA بنجاح')});
function isAppInstalled(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function showInstallHelp(){
  const secure=location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
  M(`<div dir="rtl"><h2>تثبيت HAKAM MAFIA</h2>${!secure?'<p class="audio-status">أولًا: افتح الموقع من رابط HTTPS منشور. فتح ملف HTML مباشرة لا يفعّل تثبيت PWA أو العمل دون اتصال.</p>':''}<div class="card"><h3>Brave على الكمبيوتر</h3><p class="lg">افتح القائمة ⋮، ثم ابحث عن «Install page as app» أو «تثبيت الصفحة كتطبيق». قد يظهر الخيار أيضًا بجانب شريط العنوان.</p></div><div class="card"><h3>Brave على Android</h3><p class="lg">افتح القائمة ⋮ واختر «Install app» أو «Add to Home screen»، ثم وافق على الإضافة.</p></div><div class="card"><h3>iPhone / iPad</h3><p class="lg">افتح الرابط في Safari، اضغط زر المشاركة، ثم «Add to Home Screen».</p></div><p class="mu">بعد التثبيت ستجد أيقونة HAKAM MAFIA على شاشة الهاتف أو في قائمة التطبيقات. يلزم نشر مجلد الحزمة كاملًا حتى تعمل الأيقونات والتحديثات والعمل دون اتصال.</p><button class="btn" onclick="cm()">فهمت</button></div>`);
}
async function installApp(){
  if(isAppInstalled())return toast('HAKAM MAFIA مثبت بالفعل على هذا الجهاز');
  if(deferredInstallPrompt){
    try{await deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;if(choice&&choice.outcome==='accepted')toast('تم قبول تثبيت التطبيق');else showInstallHelp()}catch(e){showInstallHelp()}
    return;
  }
  showInstallHelp();
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>console.info('HAKAM MAFIA offline support ready')).catch(err=>console.warn('Service worker registration failed:',err)));
}

warmSpeechVoices();
render();
window.__HAKAM_MAFIA_READY__=true;
window.__HAKAM_MAFIA_VERSION__="1.1.1-commercial-mvp";
</script>
